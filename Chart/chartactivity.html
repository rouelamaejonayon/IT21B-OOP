<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8deba;
        }
        canvas {
            width: 830px !important; 
            height: 500px !important; 
        }
    </style>
</head>
<body>
    
    <div>
        <canvas id="myChart"></canvas>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('myChart');
      
        new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Apple', 'Pear', 'Persimmon', 'Avocados'],
            datasets: [{
              label: 'Fruit Basket',
              data: [30, 50, 40, 60],
              borderWidth: 2,
              borderColor: 'rgba(5, 9, 0, 6)', 
              fill: false,
              pointBackgroundColor: ['green', 'yellow', 'red', 'purple'], 
              pointBorderColor: 'rgba(255, 255, 255, 1)', 
              pointBorderWidth: 2,
            }]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
    </script>
</body>
</html>
